# Publishes the website to GitHub Pages (https://rehalo.app) from main, with the AltStore / SideStore
# sources in /altstore/, built from the GitHub Releases (the .ipa files stay in the releases).
# Needs Settings › Pages › Source set to "GitHub Actions" and the custom domain rehalo.app, once.
# The iOS build runs this after it publishes a release or dev-latest. After editing a release's notes
# by hand, run it again: gh workflow run pages.yml
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/screenshots/**'
      - 'clients/ios/Sources/SmartHalo2App/Assets.xcassets/AppIcon.appiconset/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}
  # No `release` trigger: it would run on the tag, which the github-pages environment doesn't accept,
  # and would publish the website as it was at that tag.

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the website
        run: site/test/build-static.sh

      - name: Build the AltStore sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/altstore/build-source.mjs --out dist/site/altstore

      - uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
