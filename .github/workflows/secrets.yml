# Secret scanning for every contribution, plus recurring full-history audits.
# Deliberately independent from the iOS workflow: covers docs, server, emulator, etc.
name: Secret scanning (Gitleaks)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC

# No write access or custom secrets, including when a PR comes from a fork.
permissions:
  contents: read
  pull-requests: read # Gitleaks queries the PR diff via GitHub API

jobs:
  scan:
    name: gitleaks / scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Avoid posting potential secret values in PR comments, artifacts or summaries.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
